name: Windows ARM64 Native CI

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-11-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      # MSVC 14.51 (the image's Visual Studio 2026 default) miscompiles ARM64 Release code: the UI tests' command
      # buffer readers skip commands that 14.44 reads correctly from identical words. Build with 14.44 until a
      # fixed toolset ships, as x64 still does on windows-2022.
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: arm64
          toolset: '14.44'
      - name: Verify MSVC toolchain
        shell: pwsh
        run: |
          $compiler = (Get-Command cl -ErrorAction Stop).Source
          if ($compiler -notlike '*Microsoft Visual Studio*') {
            throw "Expected the MSVC cl.exe, got $compiler"
          }
          if ($compiler -notlike '*\MSVC\14.44.*') {
            throw "Expected the MSVC 14.44 toolset, got $compiler"
          }
          Write-Host "Using MSVC compiler: $compiler"
      - name: Verify ARM64 runner
        shell: pwsh
        run: if ($env:PROCESSOR_ARCHITECTURE -ne 'ARM64') { throw "Expected ARM64, got $env:PROCESSOR_ARCHITECTURE" }
      - name: Install build dependencies
        shell: pwsh
        run: |
          choco install --yes --no-progress ninja zstd
          python -m pip install meson
      - name: Install package dependencies
        run: npm ci
      - name: Cache verified native dependency SDK
        uses: actions/cache@v4
        with:
          path: ~/.cache/effindom/native-deps
          key: ${{ runner.os }}-arm64-native-deps-${{ hashFiles('NativeDeps.lock.json') }}
      - name: Build and test native runtime
        run: node scripts/build-native-runtime.mjs --target windows-arm64 --with-tests
      - name: Test native runtime packaging
        run: node --test scripts/tests/native-runtime-artifact.test.mjs scripts/tests/native-runtime-package-layout.test.mjs
      - name: Package verified native runtime SDK
        shell: pwsh
        run: node scripts/package-native-runtime.mjs --target windows-arm64 --source-commit "$env:GITHUB_SHA" --destination "$env:RUNNER_TEMP/native-runtime-windows-arm64"
      - uses: actions/upload-artifact@v4
        with:
          name: native-runtime-windows-arm64
          path: ${{ runner.temp }}/native-runtime-windows-arm64
          if-no-files-found: error
