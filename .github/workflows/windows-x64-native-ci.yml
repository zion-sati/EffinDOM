name: Windows x64 Native CI

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Verify MSVC toolchain
        shell: pwsh
        run: |
          $compiler = (Get-Command cl -ErrorAction Stop).Source
          if ($compiler -notlike '*Microsoft Visual Studio*') {
            throw "Expected the MSVC cl.exe, got $compiler"
          }
          Write-Host "Using MSVC compiler: $compiler"
      - name: Verify x64 runner
        shell: pwsh
        run: if ($env:PROCESSOR_ARCHITECTURE -ne 'AMD64') { throw "Expected AMD64, got $env:PROCESSOR_ARCHITECTURE" }
      - name: Install build dependencies
        shell: pwsh
        run: |
          choco install --yes --no-progress ninja zstd
          python -m pip install meson
      - name: Install package dependencies
        run: npm ci
      - name: Cache verified native dependency SDK
        uses: actions/cache@v4
        with:
          path: ~/.cache/effindom/native-deps
          key: ${{ runner.os }}-x64-native-deps-${{ hashFiles('NativeDeps.lock.json') }}
      - name: Build and test native runtime
        run: node scripts/build-native-runtime.mjs --target windows-x64 --with-tests
      - name: Package verified native runtime SDK
        shell: pwsh
        run: node scripts/package-native-runtime.mjs --target windows-x64 --source-commit "$env:GITHUB_SHA" --destination "$env:RUNNER_TEMP/native-runtime-windows-x64"
      - uses: actions/upload-artifact@v4
        with:
          name: native-runtime-windows-x64
          path: ${{ runner.temp }}/native-runtime-windows-x64
          if-no-files-found: error
