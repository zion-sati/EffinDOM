name: Linux ARM64 Native CI

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Verify ARM64 runner
        run: test "$(uname -m)" = aarch64
      - name: Install packaging dependency
        run: |
          sudo apt-get update
          sudo apt-get install --yes zstd
      - name: Cache verified native dependency SDK
        uses: actions/cache@v4
        with:
          path: ~/.cache/effindom/native-deps
          key: ${{ runner.os }}-arm64-native-deps-${{ hashFiles('NativeDeps.lock.json') }}
      - name: Build and test native runtime
        run: bash scripts/build-native-runtime-linux-container.sh --target linux-arm64 --with-tests
      - name: Test native runtime package layout
        run: node --test scripts/tests/native-runtime-package-layout.test.mjs
      - name: Package verified native runtime SDK
        run: node scripts/package-native-runtime.mjs --target linux-arm64 --source-commit "$GITHUB_SHA" --destination "$RUNNER_TEMP/native-runtime-linux-arm64"
      - uses: actions/upload-artifact@v4
        with:
          name: native-runtime-linux-arm64
          path: ${{ runner.temp }}/native-runtime-linux-arm64
          if-no-files-found: error
