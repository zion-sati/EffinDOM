name: macOS Native CI

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Verify arm64 runner
        run: test "$(uname -m)" = arm64
      - name: Install build dependencies
        run: brew install cmake meson ninja zstd
      - name: Install package dependencies
        run: npm ci
      - name: Cache verified native dependency SDK
        uses: actions/cache@v4
        with:
          path: ~/.cache/effindom/native-deps
          key: ${{ runner.os }}-native-deps-${{ hashFiles('NativeDeps.lock.json') }}
      - name: Build and test native runtime
        run: node scripts/build-native-runtime.mjs --target macos-arm64 --with-tests
      - name: Package verified native runtime SDK
        run: node scripts/package-native-runtime.mjs --target macos-arm64 --source-commit "$GITHUB_SHA" --destination "$RUNNER_TEMP/native-runtime-macos-arm64"
      - uses: actions/upload-artifact@v4
        with:
          name: native-runtime-macos-arm64
          path: ${{ runner.temp }}/native-runtime-macos-arm64
          if-no-files-found: error
