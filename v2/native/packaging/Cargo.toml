[package]
name = "effindom-native-packaging"
version = "0.1.0"
edition = "2021"
description = "SDK-neutral native packaging primitives for EffinDOM applications"
repository = "https://github.com/zion-sati/cargo-fui"
homepage = "https://effindom.dev"
documentation = "https://docs.rs/effindom-native-packaging"
readme = "README.md"
license = "MIT"
keywords = ["effindom", "packaging", "desktop", "gui"]
categories = ["development-tools", "gui"]
publish = ["crates-io"]
include = ["/src/**/*.rs", "/tests/**/*.rs", "/Cargo.toml", "/Cargo.lock", "/README.md", "/LICENSE.md"]

[dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
resvg = { version = "0.45", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
sha2 = "0.10"
tar = "0.4"
zip = { version = "4", default-features = false, features = ["deflate"] }
zstd = "0.13"

[lib]
name = "effindom_native_packaging"
path = "src/lib.rs"

[[bin]]
name = "effindom-native-packager"
path = "src/bin/effindom-native-packager.rs"
